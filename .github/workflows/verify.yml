name: Verify Orbit computer
on:
  push:
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
      - run: npm run test:neural:all
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: machine-verification
          path: |
            dist/machine/neural-results.json
            dist/machine/reference-results.json
